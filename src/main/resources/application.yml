spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/creditdb}
    username: ${SPRING_DATASOURCE_USERNAME:credit}
    password: ${SPRING_DATASOURCE_PASSWORD:credit}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=3600s

external:
  frankfurter:
    base-url: ${EXTERNAL_FRANKFURTER_URL:https://api.frankfurter.dev/v1}
    connect-timeout-seconds: 3
    read-timeout-seconds: 3

server:
  port: 8080

logging:
  level:
    com.dmx.credit: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.cache: TRACE

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html